<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shield-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shield-stroke" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="core-glow" x1="24" y1="18" x2="48" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#shield-bg)"/>
  
  <!-- Outer Shield Border -->
  <path d="M32 9 L51 16 C51 31 42.5 45 32 53 C21.5 45 13 31 13 16 Z" 
        fill="#0b1120" 
        stroke="url(#shield-stroke)" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Steganography synth frequency wave entering from left -->
  <path d="M19 33 C22 26 24 39 27 32 C29 27 31 35 33 32" 
        stroke="#818cf8" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.85"/>

  <!-- Cleansing Star / Spark (Dissolving AI Watermarks & Metadata) -->
  <path d="M38 18 L40.5 27 L49 29.5 L40.5 32 L38 41 L35.5 32 L27 29.5 L35.5 27 Z" 
        fill="url(#core-glow)" 
        filter="url(#neon-glow)"/>

  <!-- Ambient light points -->
  <circle cx="49" cy="18" r="2" fill="#38bdf8"/>
  <circle cx="16" cy="45" r="1.5" fill="#818cf8" opacity="0.6"/>
</svg>
